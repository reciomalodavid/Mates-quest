name: Publish Beta to GitHub Pages subfolder

on:
  push:
    branches: [beta]
    paths:
      - index.html
      - manifest.json
      - service-worker.js
      - icon-beta-192.png
      - icon-beta-512.png
      - package.json
      - scripts/build-beta.mjs
      - src/beta/**
      - src/config/app-config.json
      - .github/workflows/publish-beta-subfolder.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mates-quest-beta
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Beta source
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Beta
        working-directory: beta-source
        run: npm run build

      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace only the /beta/ folder
        run: |
          rm -rf site/beta
          mkdir -p site/beta
          cp -R beta-source/dist/. site/beta/
          touch site/beta/.nojekyll

      - name: Commit published Beta
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta
          if git diff --cached --quiet; then
            echo "No Beta changes to publish"
            exit 0
          fi
          git commit -m "deploy: publish Mates Quest Beta to /beta/"
          git push origin main
